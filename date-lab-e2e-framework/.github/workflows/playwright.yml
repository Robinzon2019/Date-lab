name: E2E Playwright

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  checks: write
  pull-requests: write

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e
        env:
          CI: true

      - name: Publicar reporte HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar resumen JUnit
        if: always() && hashFiles('test-results/junit.xml') != ''
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/junit.xml
          check_name: Playwright E2E
          require_tests: false

  publish-report:
    name: Publicar reporte en GitHub Pages
    needs: e2e
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar reporte
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: downloaded-report

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: downloaded-report/playwright-report

      - name: Desplegar GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
